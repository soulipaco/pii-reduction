# Free-text documents of the committed synthetic corpus.
#
# PERSON is in scope even though no shipped provider detects it yet: the benchmark
# reports PERSON recall as 0.000 with its true support rather than hiding the gap
# (ADR-0002, plan §2). Increment B fills it in.
dataset:
  name: benchmark_corpus_plain
  row_id: document_id

source:
  type: csv
  path: tests/fixtures/corpus/corpus.csv

destination:
  type: csv
  path: data/output/

columns:
  text:
    # Stays plain_text. `key_value` raises English tier-3 PERSON recall from 0.333 to
    # 1.000 and whole-corpus strict F1 from 0.886 to 0.910, but holding the label out
    # of processing also removes the context that was *suppressing* false positives on
    # bare identifiers: `KB Article: KB000002739` and `Rechnername: DEMO-PC-6963` are
    # then tagged PERSON and redacted, taking over-redaction from 0.000 to 0.020.
    # Q2's exit criterion requires over-redaction to stay 0.000, so neither remedy
    # ships enabled until identifier false positives are suppressed (ADR-0016, plan §8).
    parser: plain_text
    entities: [PERSON, EMAIL, PHONE]
    output_column: text_pii_redacted
    # The benchmark uses the corpus's known language rather than detection. Using a
    # detected language here would fold detection error into the PII numbers, and the
    # two failure modes need to be attributable separately. Detection quality gets its
    # own measurement at Increment E.
    language:
      mode: column
      language_column: language
