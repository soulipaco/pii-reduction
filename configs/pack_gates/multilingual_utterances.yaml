# Regression gates for the `multilingual_utterances` demo pack — short, lower-case
# German and Greek assistant utterances from MASSIVE.
#
# This is the pack that says something the committed corpus cannot. The synthetic
# German and Greek are templates this project wrote; these are sentences written by
# native speakers for another purpose entirely, unpunctuated and lower case.
#
# **There is no over-redaction gate here, and that is not an oversight.** MASSIVE
# carries no identifiers, so the pack has zero protected tokens and the metric has zero
# support. A gate that measures nothing must never be green (ADR-0009), so none is
# written. Over-redaction is gated on the two Bitext packs, which do have identifiers.
#
# Run on demand — building the pack needs a download (ADR-0017) and CI is offline:
#
#   python demo/build_pack.py multilingual_utterances
#   pii-reduction benchmark --corpus demo/packs/multilingual_utterances \
#       --gates configs/pack_gates/multilingual_utterances.yaml
#   pii-reduction benchmark --corpus demo/packs/multilingual_utterances \
#       --chain deterministic_presidio --gates configs/pack_gates/multilingual_utterances.yaml

version: 1

measured:
  pack: multilingual_utterances (200 documents, 400 entities, de + el, tier 2)
  source: AmazonScience/massive (de-DE and el-GR validation parquet)
  source_revision: ed58ac423a2f4121720918bf5301577edce4ffd3
  seed: 42
  splits: all (dev + calibration + test)
  strategy: redact
  date: 2026-08-19
  session: 8
  # The deterministic_presidio floors were re-measured in session 8 after ADR-0020
  # changed the chain under them. The deterministic_only set is untouched and still
  # reproduces at the session-6 commit below.
  # The commit carrying the code these floors were measured on — recorded in the
  # commit that follows it, because a commit cannot name its own hash. Checking
  # out this hash, rebuilding the pack from the pinned source and re-running must
  # reproduce the floors below.
  commit: 4f3716c  # ADR-0020; the deterministic_only floors still reproduce at 96eae02
  versions:
    presidio-analyzer: 2.2.364
    spacy: 3.8.15
    de_core_news_md: 3.8.0
    xx_ent_wiki_sm: 3.8.0

gate_sets:

  deterministic_only:
    description: >
      The model-free chain. EMAIL and PHONE hold at 1.000 on lower-case unpunctuated
      text in two scripts, including Greek — worth gating precisely because the
      recognizers were tuned on text this project wrote.
    gates:
      - name: email_strict_recall
        metric: strict_recall
        entity_type: EMAIL
        min: 1.000
        support: 134
      - name: phone_strict_recall
        metric: strict_recall
        entity_type: PHONE
        min: 1.000
        support: 133
      - name: overall_strict_precision
        metric: strict_precision
        min: 1.000
        support: 400
      - name: overall_strict_f1
        metric: strict_f1
        min: 0.801
        support: 400
      - name: leakage_rate
        metric: leakage_rate
        max: 0.333
        support: 400

  deterministic_presidio:
    description: >
      The hybrid chain, and the pack's headline result. **Greek PERSON strict recall is
      0.727 here against 0.444/0.667 on the committed synthetic corpus** (tiers 1 and 2;
      this pack is tier 2 throughout). Both sides of that comparison moved in session 8:
      the pack from 0.606 and the synthetic corpus from 0.111-0.222, because ADR-0020
      promoted Greek LOCATION/ORGANIZATION labels to PERSON on both. The two corpora are
      still not comparable slice for slice — different phrasing, different tier mix — so
      this is not a claim about detection quality in the abstract.

      The gap narrowed but did not close, which keeps the session-6 reading intact: the
      synthetic Greek templates, not the model alone, account for part of a gap that had
      been treated as a hard licensing limit since ADR-0007.

      **This pack independently corroborates ADR-0020 on text nobody wrote for us**, and
      in the same shape: strict precision 0.926 -> 0.893 and strict F1 0.930 -> 0.923,
      against leakage 0.065 -> 0.030, document clean rate 0.870 -> 0.940, PERSON recall
      0.805 -> 0.865 and Greek PERSON 0.606 -> 0.727. Half this pack is Greek, against a
      third of the synthetic corpus, so the precision cost lands harder here — which is
      the expected direction and the reason these floors were re-measured rather than
      assumed to hold.

      German PERSON is 1.000 on the same text, so the gap is Greek-specific rather than
      a property of lower-case public utterances.
    gates:
      # LOWERED 0.930 -> 0.923 (ADR-0020), the same trade the committed corpus made.
      - name: overall_strict_f1
        metric: strict_f1
        min: 0.923
        support: 400
      # RAISED 0.935 -> 0.955 (ADR-0020).
      - name: overall_strict_recall
        metric: strict_recall
        min: 0.955
        support: 400
      # LOWERED 0.926 -> 0.893 (ADR-0020). Larger than the committed corpus's
      # 0.935 -> 0.886 in absolute terms is not the comparison to make: half this pack
      # is Greek against a third of the corpus, so the same per-language cost shows up
      # bigger here.
      - name: overall_strict_precision
        metric: strict_precision
        min: 0.893
        support: 400
      - name: email_strict_f1
        metric: strict_f1
        entity_type: EMAIL
        min: 1.000
        support: 134
      - name: phone_strict_f1
        metric: strict_f1
        entity_type: PHONE
        min: 1.000
        support: 133
      # RAISED 0.805 -> 0.865 (ADR-0020): the recall the precision floors paid for.
      - name: person_strict_recall
        metric: strict_recall
        entity_type: PERSON
        min: 0.865
        support: 133
      - name: german_person_strict_recall
        metric: strict_recall
        entity_type: PERSON
        language: de
        difficulty_tier: "2"
        min: 1.000
        support: 67
      # RAISED 0.606 -> 0.727 (ADR-0020). This floor is the pack's whole reason for
      # existing, so it moves with the measurement rather than being left slack.
      - name: greek_person_strict_recall
        metric: strict_recall
        entity_type: PERSON
        language: el
        difficulty_tier: "2"
        min: 0.727
        support: 66
      # TIGHTENED 0.065 -> 0.030 (ADR-0020).
      - name: leakage_rate
        metric: leakage_rate
        max: 0.030
        support: 400
      # RAISED 0.870 -> 0.940 (ADR-0020).
      - name: document_clean_rate
        metric: document_clean_rate
        min: 0.940
        support: 200
