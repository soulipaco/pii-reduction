# Regression gates for the markup corpus (ADR-0029).
#
# **This corpus exists because ADR-0027 shipped without one.** The markup guard and the
# output fidelity check landed as a detection change with zero corpus support: every
# other corpus here is markup-free, so the failure class they exist for had no number
# anywhere. These are that number.
#
# It is generated, so — like the incident corpus and unlike `configs/pack_gates/` — its
# prose says nothing about realism. What it measures honestly is whether machine syntax
# survives reduction, and what happens to detection when the text is full of it.
#
# **Three of the numbers below are findings, not achievements.** All three were
# invisible to every corpus that existed before this one, which is the argument for it:
#
# 1. **PERSON strict recall is 0.322 on the hybrid chain**, against 0.821 on the
#    committed benchmark corpus. Markup does not merely cause the false positives the
#    reference implementation catalogued — **it destroys recall**, which is the worse
#    direction, because a missed name is a leak. Isolated by changing one thing at a
#    time against `en_core_web_md`:
#
#        "From: Grace Okafor"                              -> PERSON found
#        "From: Grace Okafor <grace.okafor@example.com>"    -> PERSON found
#        "<b>From:</b> Grace Okafor &lt;...&gt;<br>"        -> nothing at all
#        "Owner: Grace Okafor profile"                      -> PERSON found
#        "Owner: <a href='...' title='Grace Okafor'>..."    -> nothing at all
#
#    The model returns **no span**, so no guard, repair or reconciler rule can reach it
#    — this is upstream of everything ADR-0027 does. The reference implementation's
#    failure catalogue records only the false-positive direction; this is the half it
#    did not measure, and it is the more expensive one.
#
#    Where the markup sits explains English and German and **does not explain Greek**:
#    en/de tier 4 are both 1.000 while en tier 3 is 0.050 and de tier 3 is 0.000 — those
#    bodies carry markup around the sentence rather than inside the clause. **Greek runs
#    the other way: tier 3 is 0.400, tier 4 is 0.000.** Two languages of three, and Greek
#    is open; its tier-4 zero matches the span absorption ADR-0019 diagnosed, so markup
#    may not be the operative cause there at all.
#
# 2. **over_redaction_rate is 0.033 on the hybrid chain**, and the mechanism is the one
#    ADR-0022 already named rather than a new one. 10 of the 11 destroyed tokens are
#    Greek tier-3 ticket ids inside a PERSON span covering `Περιστατικό INC…` — the
#    Greek word plus the id — which the reconciler's identifier guard passes by design,
#    because `Περιστατικό` is name-like. The eleventh is one English tier-4 ticket id.
#    Reproducing a known mechanism on new text is the useful result here: it says the
#    asymmetry in `patterns.py` has a price on markup-dense text too.
#
# 3. **The deterministic chain destroys nothing at all** — over-redaction 0.000, and
#    EMAIL and PHONE hold at 1.000 precision *and* recall against text where an address
#    sits between `&lt;` and `&gt;`. Format-defined entities are exempt from the guard
#    (ADR-0027), so this is also the check that the exemption costs nothing here.
#
# **No gate below is a target to improve by making the corpus easier.** The Greek and
# English tier-3 numbers are low because markup-dense text is genuinely hard, and
# AGENTS.md forbids tuning a benchmark to the model. The remedy this corpus points at —
# stripping markup before detection and mapping offsets back — is a change to the
# *input*, which plan §8 Q2 measured as trading one error for another. It needs its own
# increment and its own measurement, not a corpus edit.

version: 1

measured:
  corpus: tests/fixtures/markup (90 documents, 270 entities, 330 protected tokens)
  source: generated by `pii-reduction build-markup` — there is no external source
  seed: 42
  documents_per_language: 30
  splits: all (dev + calibration + test)
  strategy: redact
  date: 2026-08-22
  session: 12
  commit: 400549d
  versions:
    presidio-analyzer: 2.2.364
    spacy: 3.8.15
    en_core_web_md: 3.8.0
    de_core_news_md: 3.8.0
    xx_ent_wiki_sm: 3.8.0

gate_sets:

  deterministic_only:
    description: >
      The model-free chain. EMAIL and PHONE hold at 1.000 against text where an
      address sits between HTML entity references, and nothing is over-redacted — no
      deterministic span has ever swallowed a tag or an identifier. That is the
      baseline the hybrid chain's 0.033 is measured against, and it is also what says
      the guard's format-defined exemption costs nothing.
    gates:
      - name: email_strict_recall
        metric: strict_recall
        entity_type: EMAIL
        min: 1.000
        support: 90
      - name: email_strict_precision
        metric: strict_precision
        entity_type: EMAIL
        min: 1.000
        support: 90
      - name: phone_strict_recall
        metric: strict_recall
        entity_type: PHONE
        min: 1.000
        support: 90
      - name: over_redaction_rate
        metric: over_redaction_rate
        max: 0.000
        support: 330
      - name: strict_f1
        metric: strict_f1
        min: 0.800
        support: 270
      - name: leakage_rate
        metric: leakage_rate
        max: 0.333
        support: 270
      - name: unreachable_entity_rate
        metric: unreachable_entity_rate
        max: 0.000
        support: 270

  deterministic_presidio:
    description: >
      The hybrid chain, and the floors here are deliberately low because the finding
      is that markup destroys recall. Raising them by editing the corpus is forbidden
      (AGENTS.md, benchmark integrity); raising them by fixing detection is the
      increment this corpus was built to make measurable.
    gates:
      - name: email_strict_recall
        metric: strict_recall
        entity_type: EMAIL
        min: 1.000
        support: 90
      - name: phone_strict_recall
        metric: strict_recall
        entity_type: PHONE
        min: 1.000
        support: 90
      - name: person_strict_recall
        metric: strict_recall
        entity_type: PERSON
        min: 0.322
        support: 90
      - name: person_strict_precision
        metric: strict_precision
        entity_type: PERSON
        min: 0.345
        support: 90
      - name: strict_f1
        metric: strict_f1
        min: 0.783
        support: 270
      - name: leakage_rate
        metric: leakage_rate
        max: 0.207
        support: 270
      - name: over_redaction_rate
        metric: over_redaction_rate
        max: 0.033
        support: 330
      - name: unreachable_entity_rate
        metric: unreachable_entity_rate
        max: 0.000
        support: 270
