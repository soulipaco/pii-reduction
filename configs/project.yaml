# Project defaults. Dataset files under datasets/ narrow these per dataset,
# and column entries narrow them again (docs/06_CONFIGURATION_CONTRACT.md).
project:
  name: databricks-pii-reduction
  environment: local
  seed: 42

processing:
  preserve_original: true
  output_suffix: _pii_redacted
  default_parser: plain_text
  default_reducer: redact
  default_provider_chain: deterministic_only
  failure_mode: preserve_original_and_record_error

language:
  # Detection with lingua arrives in Increment C; the corpus carries its language.
  mode: column
  detector: none
  language_column: language
  supported: [en, de, el]
  unknown_language: und

observability:
  log_level: INFO
  log_raw_text: false
  write_detection_audit: true

validation:
  require_row_count_match: true
  require_original_unchanged: true
  require_output_columns: true
  roundtrip_parser_test: true
