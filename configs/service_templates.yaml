# Server-side dataset templates for the service layer (ADR-0026).
#
# A template is the half of a dataset configuration a caller may NOT choose. It fixes
# the source, the destination and the processing switches, and declares the menu the
# caller picks from — columns, entity labels, parsers, chains, reducers. That split is
# what stops the service becoming a confused deputy: it runs with its own credentials,
# so a request that could name a `catalog.schema.table` could read a schema the caller
# cannot (`docs/09`, *Choosing where data is read from and written to*).
#
# Three fields are here and nowhere in the request models, deliberately, because each
# moves a privacy boundary rather than expressing a preference:
#
#   processing.failure_mode      `preserve_original_and_record_error` is ADR-0023's
#                                raw-text pass-through
#   processing.preserve_original `false` is AGENTS.md rule 4's controlled replacement
#   destination.projection       ADR-0024's grant boundary
#
# Every value below is Class A: the committed synthetic corpus and a local output
# directory. Never commit a real catalog, schema, table or path back into this file
# (`AGENTS.md` Databricks rules).

templates:
  synthetic_corpus:
    description: >-
      The committed synthetic benchmark corpus, reduced to a local CSV. Class A
      throughout — this is the template the service's own end-to-end test runs.
    source:
      type: csv
      path: tests/fixtures/corpus/corpus.csv
    destination:
      type: csv
      path: data/output/
      mode: overwrite
      # Keeps the source columns beside the reduced ones (AGENTS.md rule 4). Govern
      # the result like the raw data, not like an analytics artifact; write
      # `reduced_only` instead when the consumer must not see the source text.
      projection: full
    columns: [text]
    row_id_columns: [document_id]
    entities: [PERSON, EMAIL, PHONE]
    parsers: [plain_text, transcript]
    reducers: [redact, mask, pseudonymize]
    # Both shipped chains are on offer. `deterministic_only` needs no extras and
    # finds EMAIL and PHONE; `deterministic_presidio` is what finds PERSON, and needs
    # the presidio extra plus its models — listing an entity does not make a chain
    # capable of it.
    provider_chains: [deterministic_only, deterministic_presidio]
    # Parser options a caller may set (ADR-0034). Opt-in per option, and both of these
    # change what the *model sees* rather than only what is in scope — so neither is
    # an improvement, and a surface must not present them as one:
    #
    #   split_lines      (plain_text, ADR-0016)  right for line-structured records,
    #                    wrong for prose that wraps mid-sentence
    #   preserve_prefix  (transcript, ADR-0032)  `false` puts a named speaker in
    #                    scope; measured to cost PERSON precision where speakers are
    #                    roles
    #
    # Offered here because this corpus contains both shapes and is the one a caller
    # can experiment on safely: it is Class A synthetic throughout.
    parser_options: [split_lines, preserve_prefix]
    processing:
      preserve_original: true
      # Fail-closed (ADR-0023). Stated rather than inherited, because this is the
      # switch a template exists to hold.
      failure_mode: quarantine_row
    language:
      # The corpus carries its own language column, so detection error does not fold
      # into the result. A real dataset would use `mode: detect`.
      mode: column
      language_column: language

  # ---------------------------------------------------------------------------
  # LOCAL DEVELOPMENT ONLY. **Remove or repoint this before staging for an App.**
  #
  # `docs/19` stages the whole `configs/` tree into the App, so this template would
  # ship with it — pointing at `data/inbox/` and `data/output/` *relative to the
  # container's working directory*. If anyone then got a file where the picker can see
  # it, the run would write source and reduced text to ephemeral container-local disk,
  # outside Unity Catalog. That is verbatim the objection ADR-0036 uses to refuse
  # multipart upload, so shipping it unremarked would be arguing both sides.
  #
  # For a workspace, use the `uc_volume_inbox` shape at the bottom of this file: the
  # same mechanism, pointed at a volume, where the data stays under Unity Catalog's
  # grants and audit.
  # ---------------------------------------------------------------------------
  corpus_inbox:
    description: >-
      Any CSV dropped into a local inbox directory, reduced to a local CSV. The
      caller picks the file; the operator chose the directory (ADR-0036). The same
      shape works with a Unity Catalog volume path — `/Volumes/<catalog>/<schema>/
      <volume>/inbox/` — because a volume path is a filesystem path.
    source:
      type: csv
      # A DIRECTORY, not a file. `select_file` below is what says so, and a template
      # setting it on a source with no path is refused at load.
      #
      # Relative to the working directory, like every other path in this file, so the
      # shipped template works from a clone with no setup. Point it at a volume for a
      # workspace deployment.
      path: data/inbox/
    select_file: true
    destination:
      type: csv
      path: data/output/
      mode: overwrite
      # Keeps the source columns beside the reduced ones (AGENTS.md rule 4). Govern
      # the result like the raw data, not like an analytics artifact — and note that
      # for an *inbox* this matters more than for a fixed source, because the input is
      # whatever somebody dropped in. Write `reduced_only` instead when the consumer
      # must not see the source text (ADR-0024).
      projection: full
    # Declared, not discovered — the service does not open the file to find out what
    # is in it (ADR-0026). Every CSV dropped in this inbox is expected to carry these
    # columns; a file that does not will fail at `describe` or at the run, naming the
    # missing column.
    columns: [text]
    row_id_columns: [document_id]
    entities: [PERSON, EMAIL, PHONE]
    parsers: [plain_text, transcript]
    reducers: [redact, mask, pseudonymize]
    provider_chains: [deterministic_only, deterministic_presidio]
    parser_options: [split_lines, preserve_prefix]
    processing:
      preserve_original: true
      failure_mode: quarantine_row
    language:
      # `detect` is the right default for an inbox: nobody knows what arrives. It
      # needs the `language` extra (`pip install -e ".[language]"`, ADR-0012) — a
      # core-only install will fail every row with `LanguageNotAvailableError`. Use
      # `mode: static` with a `language:` value, or `mode: column`, when the answer is
      # already known.
      mode: detect

# A Unity Catalog template looks like this. It is COMMENTED OUT because the catalog,
# schema and table would be workspace values, and this repository holds none. Copy it
# into your own deployment's configuration directory and point it at your objects;
# running it needs the service started with `--databricks`.
#
#  uc_support_tickets:
#    description: Support tickets from Unity Catalog, reduced to Delta.
#    source:
#      type: spark_table
#      table: <catalog>.<schema>.<table>
#    destination:
#      type: delta_table
#      catalog: <catalog>
#      schema: <a schema other than the source's>
#      mode: errorifexists
#      projection: full
#    columns: [description, work_notes]
#    row_id_columns: [number]
#    entities: [PERSON, EMAIL, PHONE]
#    provider_chains: [deterministic_presidio]
#    # Offer nothing here until you have measured it on YOUR text. `split_lines` is
#    # right for a work-notes column of line-structured entries and wrong for a
#    # description column of wrapped prose, and only your data says which you have
#    # (ADR-0034). Omitting the key means callers cannot set either.
#    parser_options: []
#    processing:
#      preserve_original: true
#      failure_mode: quarantine_row
#    language:
#      mode: detect
#
# And the volume-inbox shape — the one that turns "somebody uploaded a file" into a
# run without the service ever receiving the file (ADR-0036). Whether a *Databricks
# App* can see /Volumes is UNVERIFIED by this project; the runbook's verified route
# is a serverless job. Check with `ls /Volumes/...` from the App before relying on it.
