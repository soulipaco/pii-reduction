# Regression gates for the incident-notes stress corpus (ADR-0022).
#
# **This corpus exists to stress the over-redaction gate, not to measure realism.**
# It is generated, so its prose says nothing about how the pipeline performs on text
# nobody wrote for us — that claim belongs to the public packs under `configs/pack_gates/`.
# What it does test honestly is identifier survival: operational identifier formats are
# conventions, and `is_identifier_shaped` judges a surface by token structure rather
# than meaning, so who wrote the sentence around an asset tag does not change whether
# the tag survives.
#
# It was built because the over-redaction metric was thinly supported: 102 protected
# tokens at 1.00 per document on the benchmark corpus, 56 at 0.28 of a single kind on
# `support_tickets`, and zero on `multilingual_utterances`. This adds 585 tokens across
# eight kinds at 6.5 per document.
#
# **Two of the numbers below are findings rather than achievements.** Both were
# invisible to every corpus that existed before this one, which is the entire argument
# for it:
#
# 1. `over_redaction_rate` is **0.024 on the hybrid chain**, not 0.000. All 14 destroyed
#    tokens are Greek tier-4 ticket ids swallowed by a PERSON span covering
#    `Περιστατικό INC…` — the Greek for "Incident" plus the id. **13 of the 14 are
#    native PERSON labels from the base model** and survive `promote: []`; exactly one
#    is promotion-attributable and none is attributable to ADR-0021 (`extended` is unset
#    on all 14). An earlier draft blamed promotion on the strength of one document; the
#    corrected attribution is in ADR-0022. The reconciler's identifier guard does not
#    stop it *by design* — `is_identifier_shaped` refuses only when no token is
#    name-like, and `Περιστατικό` is name-like, so the joined surface passes. That
#    asymmetry is deliberate (`patterns.py`): it prefers over-redacting a year to
#    leaking a name. This is the first corpus that puts a price on it.
#
#    **0.024 is a recorded position, not a budget.** It is gated so it cannot get
#    worse; reducing it is open work (ADR-0022).
#
# 2. `PERSON` strict recall is **0.000 at tier 4 in all three languages**, against
#    0.933–1.000 at tier 3. Not a detection failure: the transcript parser classifies
#    `2026-04-03 09:12:04 - Peter Novak:` as *structure*, so the author's name is never
#    offered to any provider. That is correct when a speaker label is a role
#    (`Customer`, `Πελάτης`) — the shape the benchmark corpus uses — and wrong when the
#    author is a person, which is what a work-note author is. **Under the shipped
#    default those names cannot be redacted by any provider or repair rule**, and they
#    are the bulk of this corpus's leakage. No tier-4 PERSON floor is written: a
#    `min: 0.000` gate measures nothing and must never be green (ADR-0009).
#
#    **ADR-0032 (session 13) rules on this and the 0.000 rows stay.** The default is
#    *preserve*; `preserve_prefix: false` is the measured per-column opt-in, and on
#    this corpus it takes strict F1 0.761 -> 0.844, leakage 0.289 -> 0.114 and tier-4
#    PERSON recall off 0.000 in all three languages. **The gates below score the
#    shipped default**, so nothing here changes: they are the price of a ruled
#    decision, not an unclosed defect. A gate written against the opt-in would be
#    scoring a configuration this repository does not ship.
#
# Regenerate and check (no download needed — this corpus is generated, not fetched):
#
#   pii-reduction build-incidents
#   pii-reduction benchmark --corpus tests/fixtures/incidents \
#       --gates configs/incident_gates.yaml
#   pii-reduction benchmark --corpus tests/fixtures/incidents \
#       --chain deterministic_presidio --gates configs/incident_gates.yaml

version: 1

measured:
  corpus: tests/fixtures/incidents (90 documents, 315 entities, 585 protected tokens)
  source: generated by `pii-reduction build-incidents` — there is no external source
  seed: 42
  documents_per_language: 30
  splits: all (dev + calibration + test)
  strategy: redact
  date: 2026-08-19
  session: 8
  # Recorded in the commit that follows the one adding these floors, because a commit
  # cannot name its own hash. A test asserts this is a hash and never a placeholder.
  commit: 08d1cb4
  versions:
    presidio-analyzer: 2.2.364
    spacy: 3.8.15
    en_core_web_md: 3.8.0
    de_core_news_md: 3.8.0
    xx_ent_wiki_sm: 3.8.0

gate_sets:

  deterministic_only:
    description: >
      The model-free chain, and the one that runs in CI. EMAIL and PHONE hold at 1.000
      against text far denser in identifiers than anything they were tuned on, and
      over-redaction is 0.000 — no deterministic span has ever swallowed an identifier.
      That is the baseline the hybrid chain's 0.024 is measured against.
    gates:
      - name: email_strict_recall
        metric: strict_recall
        entity_type: EMAIL
        min: 1.000
        support: 90
      - name: phone_strict_recall
        metric: strict_recall
        entity_type: PHONE
        min: 1.000
        support: 90
      - name: over_redaction_rate
        metric: over_redaction_rate
        max: 0.000
        support: 585
      - name: overall_strict_precision
        metric: strict_precision
        min: 1.000
        support: 315
      - name: leakage_rate
        metric: leakage_rate
        max: 0.429
        support: 315
      # Above the full-value rate, and the cause is a metric attribution artefact
      # rather than a partial redaction: the emails here are name-derived, so when a
      # PERSON leaks, four-character windows of an unrelated EMAIL survive *inside the
      # leaked name*. The ambient exclusion removes windows found outside every entity
      # span, but not windows sitting inside a different unredacted entity. Worth
      # knowing before this gap is read as a boundary error (ADR-0013 §5).
      - name: fragment_leakage_rate
        metric: fragment_leakage_rate
        max: 0.463
        support: 315

  deterministic_presidio:
    description: >
      The hybrid chain. PERSON tier 3 is 1.000/1.000/0.933 for en/de/el — the Greek
      header scores far above its 0.556 on the benchmark corpus, because a field label
      followed by a name on its own line is the easiest Greek shape there is. Tier 4 is
      0.000 everywhere for the structural reason in the header note.
    gates:
      - name: email_strict_recall
        metric: strict_recall
        entity_type: EMAIL
        min: 1.000
        support: 90
      - name: phone_strict_recall
        metric: strict_recall
        entity_type: PHONE
        min: 1.000
        support: 90
      # THE FINDING. 14 of 585, all Greek tier-4 ticket ids inside promoted spans.
      # Gated so it cannot grow; see the header note for why it is not 0.000.
      - name: over_redaction_rate
        metric: over_redaction_rate
        max: 0.024
        support: 585
      - name: overall_strict_f1
        metric: strict_f1
        min: 0.761
        support: 315
      - name: person_strict_recall
        metric: strict_recall
        entity_type: PERSON
        min: 0.326
        support: 135
      - name: en_tier3_person_strict_recall
        metric: strict_recall
        entity_type: PERSON
        language: en
        difficulty_tier: 3
        min: 1.000
        support: 15
      - name: de_tier3_person_strict_recall
        metric: strict_recall
        entity_type: PERSON
        language: de
        difficulty_tier: 3
        min: 1.000
        support: 15
      - name: el_tier3_person_strict_recall
        metric: strict_recall
        entity_type: PERSON
        language: el
        difficulty_tier: 3
        min: 0.933
        support: 15
      - name: leakage_rate
        metric: leakage_rate
        max: 0.289
        support: 315
      # Same attribution artefact as the deterministic set above.
      - name: fragment_leakage_rate
        metric: fragment_leakage_rate
        max: 0.314
        support: 315
