[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pii-reduction"
version = "0.1.0"
description = "Databricks PII reduction accelerator: structure-aware, multilingual, provider-agnostic PII detection and reduction."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["pii", "privacy", "redaction", "nlp", "databricks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Text Processing :: Linguistic",
]

# Core dependencies only (ADR-0008). The whole unit-test suite, the deterministic
# provider, parsers, reducers and evaluation must work with these alone — no NLP
# model downloads, no provider extras.
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "pandas>=1.5,<3",   # upper bound is a Spark-parity decision (ADR-0006)
  "phonenumbers>=8.13",
]

[project.scripts]
pii-reduction = "pii_reduction.cli:main"
# The Databricks front door is its own script, not a flag on the one above: the core
# CLI must stay importable without Spark, and `tests/test_package.py` pins that
# statically (ADR-0025).
pii-reduction-databricks = "pii_reduction.databricks.cli:cli"
# Rung 4 (ADR-0026). A third script rather than a `pii-reduction serve` subcommand:
# that would make `cli.py` import `pii_reduction.service`, which the reverse import
# guard in `tests/test_package.py` forbids — including from inside a function, since
# the guard walks the AST.
pii-reduction-service = "pii_reduction.service.cli:main"

[project.optional-dependencies]
# spaCy models are installed by documented command, never declared here: they are
# not on PyPI and pinning wheel URLs in metadata breaks resolvers (ADR-0008).
# el_core_news_* must never appear here — CC BY-NC-SA, incompatible with MIT (ADR-0007).
presidio = [
  "presidio-analyzer>=2.2",
  "spacy>=3.7,<4",
]
language = [
  "lingua-language-detector>=2.0",
]
# Parquet sources and destinations. Kept optional so the core install stays small;
# CSV works without it (amends ADR-0008's extras list, session 3).
parquet = [
  "pyarrow>=14",
]
# Version selected against the workspace runtime at Increment F (ADR-0006).
# Lives in its OWN venv, never the core one: the client pins pyspark and couples to
# the server runtime, and the client's Python minor must match it (ADR-0006, amended
# session 7). 15.4 LTS pairs with Python 3.11; 16.x with 3.12. Both handshake with
# versionless serverless; use the newest the local Python allows:
#   uv venv .venv-dbx --python 3.12
#   VIRTUAL_ENV=.venv-dbx uv pip install -e ".[databricks]"
databricks = [
  "databricks-connect>=15.4",
]
# Rung 4's HTTP surface (ADR-0026, amending ADR-0008's extras list). Only
# `service/api.py` names it; `pii_reduction.service` stays importable without it.
service = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
dev = [
  # A PEP 517 front end for local wheel builds. `databricks.yml` uses `uv build`
  # instead, because the CLI runs its artifact command with PATH `python`.
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "Faker>=25",
  "pyarrow>=14",       # so the parquet adapters are covered by the default test run
  # So the service layer's HTTP surface is covered by the DEFAULT test run rather
  # than a tier nobody runs (ADR-0026). `httpx` is not optional here: TestClient and
  # ASGITransport both need it, and "a real ASGI transport, not a mock" is the
  # property that decision rests on. It was present in the dev venv undeclared.
  "fastapi>=0.110",
  "httpx>=0.27",
  "pandas-stubs",      # typing only
]

[tool.hatch.build.targets.wheel]
packages = ["src/pii_reduction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the fast, model-free tier (ADR-0009). Opt in explicitly:
#   pytest -m integration
addopts = "-ra -m 'not integration and not slow and not databricks'"
markers = [
  "unit: fast, model-free tests (the default tier)",
  "integration: requires real providers or NLP models",
  "slow: long-running tests",
  "databricks: requires a Databricks workspace; never runs in CI (ADR-0009)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Documentation is the source of truth and its code samples are illustrative;
# the Claude Code harness under .claude/ is tooling, not project source.
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# This project processes Greek and German text on purpose, so "ambiguous Unicode
# character" warnings fire on legitimate multilingual fixtures and prose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

# Optional extras. The type checker has to model what the packaging already says
# (ADR-0008): these are absent in a core install, and the adapters that import them
# do so lazily for exactly that reason. Without this, `mypy src tests` passes on a
# developer machine with the extras installed and fails in the push tier that
# deliberately installs neither — which is how CI found it on the first real run.
# `fastapi` is deliberately absent from the override list below: it is also in `dev`,
# so it is present wherever the default tier runs, and if it goes missing that is a
# packaging error worth failing on rather than typing around.
#
# `uvicorn` is the opposite case and is listed, because it is in the `service` extra
# and **not** in `dev`. It is a *server*: the default tier never serves — the tests
# inject `serve` — so putting it in `dev` would install a server nobody starts in
# order to satisfy a type checker. This override is ADR-0008's rule applied
# unchanged: the type checker models what the packaging already says.
#
# Found by CI, not locally, for the reason session 4 first recorded: the dev machine
# had uvicorn installed by hand, so `mypy src tests` passed here and failed on both
# runners. Reproduced afterwards in a throwaway `.[dev]` venv, which is the check
# that should have come first.
[[tool.mypy.overrides]]
module = [
  "presidio_analyzer",
  "presidio_analyzer.*",
  "lingua",
  "lingua.*",
  "databricks.connect",
  "databricks.connect.*",
  # `pyspark` arrives with databricks-connect, and `databricks/session.py` reaches
  # for it lazily to reuse a session the Databricks runtime already built.
  "pyspark",
  "pyspark.*",
  # `service` extra only, never `dev` — see the note above.
  "uvicorn",
  "uvicorn.*",
  # `parquet` extra only. `ParquetOutput` imports it in its constructor to fail in
  # the first second rather than after the run (ADR-0027's sibling finding in
  # `docs/20`), and it ships no `py.typed` — so it is untyped where it is installed
  # and missing where it is not. Both cases are this override.
  "pyarrow",
  "pyarrow.*",
]
ignore_missing_imports = true
