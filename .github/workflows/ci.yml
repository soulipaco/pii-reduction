# Tier 1 of ADR-0009: the fast, model-free gate that runs on every push and PR.
#
# Core + dev install only. No provider extra, no spaCy model, no network beyond PyPI.
# If this job needs a model to pass, something has leaked out of an optional extra
# and into the core library — which is the leak this job exists to catch.
#
# Windows is not a courtesy: it is the primary development machine, and the parser
# round-trip invariant is byte-exact, so CRLF and path bugs must surface here.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches .claude/settings.json: multilingual fixtures and deterministic hashing.
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  PYTHONIOENCODING: "utf-8"

jobs:
  quality:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    defaults:
      run:
        # Explicit, because GitHub defaults to PowerShell on Windows runners and the
        # point of the matrix is to run the *same* commands on both platforms. A job
        # that quietly runs different shells is not testing cross-platform behaviour.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (core + dev only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm no provider extra leaked into the core install
        # The A1 exit criterion, asserted rather than assumed. Until now it was only
        # ever true by accident: nothing stopped a core module importing spaCy.
        run: |
          python - <<'PY'
          import importlib.util as util
          import sys

          import pii_reduction
          import pii_reduction.language
          import pii_reduction.providers

          leaked = [m for m in ("presidio_analyzer", "spacy", "lingua") if util.find_spec(m)]
          if leaked:
              sys.exit(f"provider extras present in the core install: {', '.join(leaked)}")
          print(f"pii-reduction {pii_reduction.__version__}: core install clean")
          PY

      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: mypy
        run: mypy src tests

      - name: pytest (default tier — excludes integration, slow, databricks)
        run: pytest -q

      - name: Benchmark regression gates (deterministic chain)
        # Runs here rather than nightly because the deterministic chain needs no
        # model and its numbers are exactly reproducible. Values come from a measured
        # baseline and live in one reviewed file (ADR-0009).
        run: pii-reduction benchmark --gates configs/benchmark_gates.yaml

      - name: Incident-notes gates (deterministic chain)
        # The over-redaction stress corpus (ADR-0022). Its deterministic gates are
        # model-free, so unlike the demo packs they belong on every push: this is the
        # corpus that carries 585 protected tokens against the benchmark corpus's 102,
        # and over-redaction is the metric it exists to hold down. Its hybrid gates
        # need models and run in the integration workflow.
        run: >
          pii-reduction benchmark --corpus tests/fixtures/incidents
          --gates configs/incident_gates.yaml

      - name: Markup gates (deterministic chain)
        # The corpus that gives ADR-0027's guard a number (ADR-0029). This set is
        # model-free and runs in about a second, so it belongs on every push for the
        # same reason the incident set does. Its hybrid gates need models and run in
        # the integration workflow — and only that half could be moved by a model bump.
        run: >
          pii-reduction benchmark --corpus tests/fixtures/markup
          --gates configs/markup_gates.yaml

      - name: Packaged assets are actually in the wheel
        # The control panel is a non-Python file inside the package (ADR-0035) and the
        # service reads it at startup, so a wheel without it is a hosted App that fails
        # to start — discovered at deploy time, on the workspace. Hatchling's file
        # selection honours .gitignore, so an ordinary ignore line could drop it with
        # every other test still green. Excluded from the default tier because it
        # shells out to the build backend; run here because this is the tier that
        # protects a deploy.
        run: pytest -q -m packaging

      - name: Corpora are reproducible from their seeds
        # The committed corpora are the ground truth every metric above is scored
        # against. If regenerating one from the same seed does not reproduce it byte
        # for byte, the gates are measuring a different corpus than the repository's.
        run: |
          pii-reduction build-corpus --out "${RUNNER_TEMP}/corpus"
          diff -r tests/fixtures/corpus "${RUNNER_TEMP}/corpus"
          pii-reduction build-incidents --out "${RUNNER_TEMP}/incidents"
          diff -r tests/fixtures/incidents "${RUNNER_TEMP}/incidents"
          pii-reduction build-markup --out "${RUNNER_TEMP}/markup"
          diff -r tests/fixtures/markup "${RUNNER_TEMP}/markup"
